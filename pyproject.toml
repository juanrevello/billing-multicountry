[project]
name = "billing"
version = "0.1.0"
description = "Multi-country invoicing service"
authors = [
    { name = "juanrevello", email = "juanmanuelrevello@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.149.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
